version: '3.9'

name: cms-backend

services:
  # ─────────────────────────────────────────
  #  API — Monolito Node.js principal
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: cms_api
    restart: unless-stopped
    env_file: .env
    environment:
      # Sobreescribir hosts para que apunten a los servicios Docker (no localhost)
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MONGODB_URL: mongodb://${MONGO_USER:-cms_mongo}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB:-cms_analytics}?authSource=admin
      ELASTIC_HOST: http://elasticsearch:9200
      MINIO_ENDPOINT: minio
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - cms_net
    labels:
      - 'traefik.enable=true'

  # ─────────────────────────────────────────
  #  NGINX — Reverse Proxy / Gateway
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: cms_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - cms_net

  # ─────────────────────────────────────────
  #  PostgreSQL — Base de datos principal
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-cms_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cms_user} -d ${POSTGRES_DB:-cms_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms_net

  # ─────────────────────────────────────────
  #  Redis — Caché, sesiones, queues, rate limiting
  # ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: cms_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?error}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms_net

  # ─────────────────────────────────────────
  #  MongoDB — Analytics, eventos, logs flexibles
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: cms_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cms_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?error}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-cms_analytics}
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - '${MONGO_PORT:-27017}:27017'
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms_net

  # ─────────────────────────────────────────
  #  MinIO — Almacenamiento de archivos (S3-compatible)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: cms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-cms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?error}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cms_net

  # ─────────────────────────────────────────
  #  Elasticsearch — Búsqueda full-text
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: cms_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?error}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - '${ELASTIC_PORT:-9200}:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -u elastic:${ELASTIC_PASSWORD} -s http://localhost:9200/_cluster/health | grep -v "red"']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cms_net

  # ─────────────────────────────────────────
  #  BullMQ Board — UI de colas (dev only)
  # ─────────────────────────────────────────
  bull-board:
    image: deadly0/bull-board:latest
    container_name: cms_bull_board
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BULL_PREFIX: '{bull}'
    ports:
      - '3001:3000'
    depends_on:
      - redis
    networks:
      - cms_net
    profiles:
      - dev-tools

  # ─────────────────────────────────────────
  #  Prometheus — Métricas
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: cms_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - cms_net
    profiles:
      - monitoring

  # ─────────────────────────────────────────
  #  Grafana — Dashboards
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: cms_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?error}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - '3002:3000'
    depends_on:
      - prometheus
    networks:
      - cms_net
    profiles:
      - monitoring

# ─────────────────────────────────────────
#  Volúmenes persistentes
# ─────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  nginx_certs:
  nginx_logs:
  api_uploads:

# ─────────────────────────────────────────
#  Red interna
# ─────────────────────────────────────────
networks:
  cms_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
