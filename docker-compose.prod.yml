version: '3.9'

name: cms-backend-prod

# ─────────────────────────────────────────
#  Producción: imagen compilada, sin volúmenes
#  de código, secrets via Docker Secrets o
#  variables de entorno del host
# ─────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: cms-backend:${VERSION:-latest}
    container_name: cms_api_prod
    restart: always
    env_file: .env.prod
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms_net_prod
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  nginx:
    image: nginx:1.25-alpine
    container_name: cms_nginx_prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - cms_net_prod

  postgres:
    image: postgres:16-alpine
    container_name: cms_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms_net_prod
    # No exponer puertos en producción
    expose:
      - '5432'

  redis:
    image: redis:7.2-alpine
    container_name: cms_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms_net_prod
    expose:
      - '6379'

  mongodb:
    image: mongo:7.0
    container_name: cms_mongodb_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data_prod:/data/db
    networks:
      - cms_net_prod
    expose:
      - '27017'

  minio:
    image: minio/minio:latest
    container_name: cms_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data_prod:/data
    networks:
      - cms_net_prod
    expose:
      - '9000'

volumes:
  postgres_data_prod:
  redis_data_prod:
  mongodb_data_prod:
  minio_data_prod:
  nginx_logs:

networks:
  cms_net_prod:
    driver: bridge
